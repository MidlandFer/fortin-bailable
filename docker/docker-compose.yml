version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fortin
      POSTGRES_PASSWORD: fortin
      POSTGRES_DB: fortin_bailable
    ports:
      - "5432:5432"
    volumes:
      - fortin_pgdata:/var/lib/postgresql/data

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - ../.env
    ports:
      - "3000:3000"

volumes:
  fortin_pgdata:
