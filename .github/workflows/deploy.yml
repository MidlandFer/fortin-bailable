name: Deploy a Coolify

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Coolify
        env:
          COOLIFY_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK_URL" ] || [ -z "$COOLIFY_API_TOKEN" ]; then
            echo "Faltan los secrets COOLIFY_DEPLOY_WEBHOOK_URL y/o COOLIFY_API_TOKEN en este repo (Settings > Secrets and variables > Actions). Ver README, sección Auto-deploy." >&2
            exit 1
          fi
          # --fail-with-body: si Coolify rechaza el pedido, el log muestra su
          # respuesta (ej. token inválido, permiso faltante, uuid inexistente).
          curl --fail-with-body --silent --show-error -w "\nHTTP %{http_code}\n" \
            -X POST "$COOLIFY_DEPLOY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN"
