name: Deploy a Coolify

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en Coolify
        env:
          COOLIFY_DEPLOY_WEBHOOK_URL: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [ -z "$COOLIFY_DEPLOY_WEBHOOK_URL" ]; then
            echo "Falta configurar el secret COOLIFY_DEPLOY_WEBHOOK_URL en este repo (Settings > Secrets and variables > Actions). Ver README, sección Auto-deploy." >&2
            exit 1
          fi
          if [ -n "$COOLIFY_API_TOKEN" ]; then
            curl --fail --silent --show-error -X POST "$COOLIFY_DEPLOY_WEBHOOK_URL" \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN"
          else
            curl --fail --silent --show-error -X POST "$COOLIFY_DEPLOY_WEBHOOK_URL"
          fi
